name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and simulator (without Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest (core and simulator scenarios)
        run: pytest tests/core tests/scenarios -p no:homeassistant

  homeassistant:
    name: Integration (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt pytest-homeassistant-custom-component
      - name: Mypy (strict)
        run: mypy custom_components/zephyr
      - name: Pytest (Home Assistant)
        run: pytest tests/ha

  frontend:
    name: Panel (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The committed build is up to date
        run: git diff --exit-code -- ../custom_components/zephyr/frontend || (echo "Run 'npm run build' in frontend/ and commit the result." && exit 1)
