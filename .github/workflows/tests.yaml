name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core and simulator (without Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest (core and simulator scenarios)
        run: pytest tests/core tests/scenarios -p no:homeassistant

  homeassistant:
    name: Integration (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt pytest-homeassistant-custom-component
      - name: Mypy (strict)
        run: mypy custom_components/zem
      - name: Pytest (Home Assistant)
        run: pytest tests/ha
