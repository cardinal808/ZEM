name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy (core, strict)
        run: mypy custom_components/zem/core
      - name: Pytest
        run: pytest
