# ZEPHYR test dashboard (M4b) — standard Home Assistant cards only.
# Add it: Settings → Dashboards → Add dashboard → New dashboard from scratch,
# open it, ⋮ → Edit dashboard → ⋮ → Raw configuration editor, paste this file.
# Entity ids are ZEPHYR's defaults for set 1; adjust them if yours differ.
title: ZEPHYR test
views:
  - title: Test
    path: zephyr-test
    icon: mdi:battery-sync
    cards:
      - type: vertical-stack
        cards:
          - type: tile
            entity: switch.zephyr_control
            name: ZEPHYR stuurt de accu
            features_position: bottom
            vertical: false
            features:
              - type: toggle
          - type: tile
            entity: select.zephyr_mode
            features_position: bottom
            vertical: false
            features:
              - type: select-options
          - type: markdown
            content: >-
              **Reden:** {{ states('sensor.zephyr_reason') }}

              **Aansturing:** {{ states('sensor.zephyr_control') }}
              {%- set b = state_attr('switch.zephyr_control', 'blockers') %}
              {%- if b %} — niet mogelijk: {{ b | join('; ') }}{% endif %}

      - type: grid
        columns: 3
        square: false
        visibility:
          - condition: state
            entity: select.zephyr_mode
            state: standby
          - condition: state
            entity: switch.zephyr_control
            state: "off"
        cards:
          - type: button
            name: Lever 300 W
            icon: mdi:home-export-outline
            tap_action:
              action: perform-action
              perform_action: zephyr.test_command
              data:
                power: -300
                duration: 60
              confirmation:
                text: 60 s 300 W leveren en daarna standby?
          - type: button
            name: Laad 300 W
            icon: mdi:home-import-outline
            tap_action:
              action: perform-action
              perform_action: zephyr.test_command
              data:
                power: 300
                duration: 60
              confirmation:
                text: 60 s 300 W laden en daarna standby?
          - type: button
            name: Stop test
            icon: mdi:stop-circle-outline
            tap_action:
              action: perform-action
              perform_action: zephyr.test_command
              data:
                power: 0
                duration: 1

      - type: history-graph
        title: Net, accu en doel
        hours_to_show: 1
        entities:
          - entity: sensor.zephyr_grid_power
            name: Net (P1)
          - entity: sensor.zephyr_power
            name: Accu
          - entity: sensor.zephyr_setpoint
            name: Doel ZEPHYR

      - type: entities
        title: Nu
        entities:
          - entity: sensor.zephyr_state_of_charge
            name: Laadtoestand
          - entity: sensor.zephyr_action
            name: Actie
          - entity: binary_sensor.zephyr_expensive_hour
            name: Duur uur
          - type: attribute
            entity: binary_sensor.zephyr_expensive_hour
            attribute: next_expensive
            name: Volgende dure uur
          - type: attribute
            entity: binary_sensor.zephyr_expensive_hour
            attribute: reserve_charge
            name: Nu bijladen voor de reserve
          - entity: binary_sensor.zephyr_p1_ok
            name: P1 meldt
          - entity: binary_sensor.zephyr_set_1_online
            name: Set 1 online
          - entity: binary_sensor.zephyr_set_1_fault
            name: Set 1 storing

      - type: entities
        title: Tellers set 1 (24 uur)
        entities:
          - entity: sensor.zephyr_set_1_write_count
            name: Schrijfacties
          - type: attribute
            entity: sensor.zephyr_set_1_write_count
            attribute: ram_1h
            name: RAM laatste uur
          - type: attribute
            entity: sensor.zephyr_set_1_write_count
            attribute: flash_24h
            name: Flash
          - type: attribute
            entity: sensor.zephyr_set_1_write_count
            attribute: flash_standby_24h
            name: Flash door standby
          - type: attribute
            entity: sensor.zephyr_set_1_write_count
            attribute: flash_paused
            name: Flash-vangnet actief
          - entity: sensor.zephyr_set_1_switch_count
            name: Relaisschakelingen

      - type: entities
        title: Kosten (B38)
        entities:
          - entity: sensor.zephyr_costs_today
            name: Kosten vandaag
          - entity: sensor.zephyr_savings_today
            name: Besparing vandaag
          - type: attribute
            entity: sensor.zephyr_savings_today
            attribute: savings_battery
            name: waarvan accu
          - type: attribute
            entity: sensor.zephyr_savings_today
            attribute: savings_trade
            name: waarvan prijsverschil
          - entity: sensor.zephyr_costs_month
            name: Kosten deze maand
          - entity: sensor.zephyr_savings_month
            name: Besparing deze maand

      - type: entities
        title: Plan (schaduw, M5)
        entities:
          - entity: sensor.zephyr_plan_action
            name: Plan nu
          - entity: sensor.zephyr_plan_state
            name: Toestand
          - entity: sensor.zephyr_plan_reason
            name: Reden
          - entity: sensor.zephyr_planned_grid_charge
            name: Gepland netladen
          - type: attribute
            entity: sensor.zephyr_planned_grid_charge
            attribute: cost
            name: Kosten netladen (€)
          - entity: sensor.zephyr_battery_empty_at
            name: Accu leeg om
          - entity: sensor.zephyr_plan_calculated_at
            name: Berekend om

      - type: markdown
        title: Plan in blokken
        content: >-
          {% set blocks = state_attr('sensor.zephyr_plan_action', 'blocks') or [] %}
          {% set names = {'charge': 'Laden', 'hold': 'Vasthouden', 'deliver': 'Leveren', 'export': 'Terugleveren'} %}
          | Van | Tot | Actie | kWh | € gem. |
          |---|---|---|---|---|
          {% for b in blocks %}| {{ as_timestamp(b.start) | timestamp_custom('%a %H:%M') }} | {{ as_timestamp(b.end) | timestamp_custom('%H:%M') }} | {{ names[b.action] }}{{ ' *' if b.indicative }} | {{ b.kwh }} | {{ '%.3f' % b.price }} |
          {% endfor %}
          \* indicatief: prijzen van morgen nog onbekend
